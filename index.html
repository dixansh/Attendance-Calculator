<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="ZbF-XY8vO_fcRmppe3CDMaX6AqzeRB-GZLJ0dsvp7v8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Advanced Attendance Calculator & Planner | Dynamic Track</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 3D Base Colors */
            --bg-base: #e0e5ec;
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --text-dark: #2d3748;
            --text-muted: #718096;
            
            /* 3D Light & Shadow Variables */
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            
            /* Physical Button Gradients */
            --btn-gradient: linear-gradient(135deg, #5c54ec, #3f36d6);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-dark);
            padding: 40px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background: var(--bg-base);
            padding: 40px 32px;
            border-radius: 36px;
            width: 100%;
            max-width: 520px;
            position: relative;
            box-shadow: 
                20px 20px 40px var(--shadow-dark), 
                -20px -20px 40px var(--shadow-light),
                inset 2px 2px 3px rgba(255,255,255,0.5);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .card-header {
            position: relative;
            margin-bottom: 36px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-shadow: 2px 2px 4px rgba(163, 177, 198, 0.5), -2px -2px 4px #ffffff;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .settings-toggle-btn {
            position: absolute;
            top: -4px;
            right: 0;
            background: var(--bg-base);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            box-shadow: 
                6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.3);
            user-select: none;
        }
        .settings-toggle-btn:active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.96);
        }

        .settings-panel {
            background: var(--bg-base);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 28px;
            display: none;
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark), 
                inset -6px -6px 12px var(--shadow-light);
        }

        .settings-panel-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 1px #fff;
        }

        .input-group, .side-by-side-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
            width: 100%;
        }

        .side-by-side-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-shadow: 1px 1px 1px #fff;
        }

        .select-wrapper { position: relative; width: 100%; }

        input, select {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--bg-base);
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark), 
                inset -6px -6px 12px var(--shadow-light);
        }

        select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 40px; }

        .select-wrapper::after {
            content: "▼";
            font-size: 0.7rem;
            color: var(--text-muted);
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        input:focus, select:focus {
            box-shadow: 
                inset 8px 8px 16px var(--shadow-dark), 
                inset -8px -8px 16px var(--shadow-light),
                0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .calc-btn { 
            background: var(--btn-gradient);
            box-shadow: 
                10px 10px 20px rgba(163, 177, 198, 0.6), 
                -10px -10px 20px #ffffff,
                inset 0 4px 6px rgba(255, 255, 255, 0.3),
                inset 0 -4px 6px rgba(0, 0, 0, 0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .calc-btn:hover { transform: translateY(-2px); }
        .calc-btn:active { 
            transform: translateY(2px);
            box-shadow: 
                4px 4px 8px rgba(163, 177, 198, 0.6), 
                -4px -4px 8px #ffffff,
                inset 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .choice-container { display: grid; gap: 14px; margin-top: 32px; }
        .choice-container.layout-grid-low { grid-template-columns: 1fr 1fr; }
        .choice-container.layout-grid-low .secondary-btn:first-child { grid-column: span 2; }
        .choice-container.layout-grid-safe { grid-template-columns: 1fr; }

        .secondary-btn {
            background-color: var(--bg-base);
            color: var(--text-dark);
            font-size: 0.82rem;
            padding: 16px 12px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 
                6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
        }
        .secondary-btn:active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
        }
        .btn-active { 
            background-color: var(--bg-base) !important;
            color: var(--primary) !important;
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark), 
                inset -6px -6px 12px var(--shadow-light) !important;
        }

        .toggle-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        .toggle-btn {
            padding: 14px;
            font-weight: 700;
            background: var(--bg-base);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.2s;
            box-shadow: 
                4px 4px 8px var(--shadow-dark), 
                -4px -4px 8px var(--shadow-light);
        }
        .toggle-active {
            color: var(--primary);
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
        }

        .result-section, .panel-section, .report-box {
            margin-top: 36px;
            padding-top: 32px;
            border-top: 2px solid rgba(255,255,255,0.6);
            display: none;
        }

        .percentage {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            margin: 12px 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
            color: var(--bg-base);
            text-shadow: 
                -1px -1px 2px #fff,
                2px 2px 3px rgba(0,0,0,0.2),
                inset 1px 1px 1px rgba(0,0,0,0.5);
            background-clip: text;
        }
        .pct-pass { color: var(--success); text-shadow: 2px 2px 4px rgba(16, 185, 129, 0.4), -2px -2px 4px #ffffff; }
        .pct-fail { color: var(--danger); text-shadow: 2px 2px 4px rgba(239, 68, 68, 0.4), -2px -2px 4px #ffffff; }

        .status-message {
            font-weight: 800;
            font-size: 0.75rem;
            padding: 8px 20px;
            border-radius: 100px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1), inset -2px -2px 4px rgba(255,255,255,0.8);
        }
        .status-pass { background-color: #d1fae5; color: #065f46; }
        .status-fail { background-color: #fee2e2; color: #991b1b; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .single-card-grid { grid-template-columns: 1fr; }
        
        .dashboard-card {
            background-color: var(--bg-base);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 
                8px 8px 16px var(--shadow-dark), 
                -8px -8px 16px var(--shadow-light),
                inset 1px 1px 2px rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.4);
        }
        
        .dashboard-val {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 6px;
            line-height: 1.2;
            color: var(--text-dark);
            text-shadow: 1px 1px 2px rgba(163, 177, 198, 0.5);
        }
        
        .dashboard-lbl {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .highlight-box {
            background-color: var(--bg-base);
            border-left: 6px solid var(--primary);
            padding: 20px;
            border-radius: 0 16px 16px 0;
            margin-top: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.5;
            box-shadow: 
                5px 5px 10px var(--shadow-dark), 
                -5px -5px 10px var(--shadow-light);
        }

        .error-message {
            color: var(--danger);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 24px;
            display: none;
            text-align: center;
            padding: 16px;
            background-color: var(--bg-base);
            border-radius: 16px;
            box-shadow: inset 4px 4px 8px rgba(239, 68, 68, 0.2), inset -4px -4px 8px #ffffff;
        }

        .recovery-info-text {
            grid-column: span 2;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-dark);
            letter-spacing: 0.02em;
            margin-bottom: -4px;
            text-align: left;
            text-shadow: 1px 1px 1px #fff;
        }

        .leave-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-base);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
        }

        .add-row-btn {
            background: var(--bg-base);
            color: var(--primary);
            padding: 16px;
            font-size: 0.85rem;
            font-weight: 800;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 
                4px 4px 8px var(--shadow-dark), 
                -4px -4px 8px var(--shadow-light);
        }
        .add-row-btn:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }

        .remove-row-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            box-shadow: 
                4px 4px 8px rgba(239, 68, 68, 0.4), 
                -2px -2px 6px #ffffff,
                inset 0 2px 2px rgba(255,255,255,0.3);
        }
        .remove-row-btn:active { transform: translateY(2px); box-shadow: inset 0 4px 8px rgba(0,0,0,0.2); }

        .panel-title {
            margin: 0 0 24px 0;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-shadow: 1px 1px 2px #fff;
        }

        .credits-footer {
            margin-top: 48px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            text-shadow: 1px 1px 1px #fff;
        }
        .credits-footer strong { color: var(--text-dark); font-weight: 800; }
        .branch-text { display: block; margin-top: 4px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="card-header">
        <h1>📊 Attendance Planner</h1>
        <div class="subtitle">Track criteria benchmarks & leave impacts</div>
        <div id="settingsToggle" class="settings-toggle-btn" title="Open Settings">⚙️</div>
    </div>

    <div id="settingsPanel" class="settings-panel">
        <div class="settings-panel-title">Configuration Options</div>
        
        <div class="input-group" style="margin-bottom: 20px;">
            <label for="configCriteria">Attendance Goal Target Criteria (%)</label>
            <input type="number" id="configCriteria" value="75" min="1" max="100" placeholder="e.g. 75">
        </div>

        <div class="input-group" style="margin-bottom: 20px;">
            <label for="globalClassesPerDay">Default Classes Held Per Day</label>
            <input type="number" id="globalClassesPerDay" value="6" min="1" placeholder="e.g. 6">
        </div>

        <div class="input-group" style="margin-bottom: 4px;">
            <label>Are Saturdays operational working days?</label>
            <div class="toggle-container">
                <button type="button" id="satNoBtn" class="toggle-btn toggle-active">No, closed</button>
                <button type="button" id="satYesBtn" class="toggle-btn">Yes, working day</button>
            </div>
        </div>
    </div>
    
    <div class="input-group">
        <label for="totalClasses">Total Classes Conducted (As of Today)</label>
        <input type="number" id="totalClasses" placeholder="e.g. 100">
    </div>
    
    <div class="input-group">
        <label for="attendedClasses">Classes Attended (As of Today)</label>
        <input type="number" id="attendedClasses" placeholder="e.g. 75">
    </div>

    <button id="calcBtn" class="btn calc-btn">Calculate Attendance</button>
    <div id="errorBox" class="error-message"></div>

    <div id="resultBox" class="result-section" style="text-align: center;">
        <label style="color: var(--text-muted); font-weight:800; font-size: 0.75rem; display:block;">CURRENT ATTENDANCE</label>
        <div id="displayPct" class="percentage">0.00%</div>
        <div id="displayStatus" class="status-message"></div>
        
        <div id="optionsContainer" class="choice-container">
            <button id="optRecoveryBtn" class="secondary-btn">📈 Check Attendance Recovery</button>
            <button id="optLeavesBtn" class="secondary-btn">📅 Leave Planning Dashboard</button>
            <button id="optExamsBtn" class="secondary-btn">📝 Exam Streak Target Tracker</button>
        </div>
    </div>

    <div id="recoveryPanel" class="panel-section">
        <h3 class="panel-title">📈 Attendance Recovery Timeline</h3>
        <div id="recoveryGrid" class="dashboard-grid" style="display:none;"></div>
        <div id="recoverySafeReport" class="highlight-box" style="display:none; border-left-color: var(--success);"></div>
    </div>

    <div id="leavesPanel" class="panel-section">
        <h3 class="panel-title">📅 Leave Planning</h3>

        <div class="input-group" style="margin-top: 20px;">
            <label>⚡ Select Leave Input Type</label>
            <div class="select-wrapper">
                <select id="leaveMethod">
                    <option value="manual">Enter Total Days / Classes Directly</option>
                    <option value="calendar">Select Dates from Calendar</option>
                </select>
            </div>
        </div>

        <div id="manualInputGroup" class="side-by-side-group">
            <div>
                <label id="lblManualLeaveDays">Working Days of Leave</label>
                <input type="text" id="manualLeaveDays" placeholder="e.g. 1 Day" value="0 Days">
            </div>
            <div>
                <label for="manualLeaveClasses">Total Leave Classes</label>
                <input type="number" id="manualLeaveClasses" placeholder="e.g. 9" min="0" value="0">
            </div>
        </div>

        <div id="calendarInputGroup" style="display:none;">
            <label style="margin-bottom:12px;">Add Leave Windows:</label>
            <div id="leaveRowsContainer"></div>
            <button type="button" class="add-row-btn" id="addLeaveRowBtn">+ Add Leave Period</button>
        </div>

        <button id="runLeavesBtn" class="btn calc-btn">Calculate Leave Impact & Recovery</button>
        
        <div id="leaveReportBox" class="report-box">
            <div id="leaveGrid" class="dashboard-grid"></div>
            <div id="leaveRecoveryGrid" class="dashboard-grid"></div>
            <div id="leaveStatusBox" class="highlight-box"></div>
            
            <div id="leaveExamSection" style="display:none; margin-top:32px; border-top:2px solid rgba(255,255,255,0.6); padding-top:28px;">
                <button type="button" id="toggleLeaveExamBtn" class="secondary-btn" style="width:100%;">
                    📝 Check Post-Leave Exam Eligibility Status
                </button>

                <div id="leaveExamDrawer" style="display:none; margin-top:28px;">
                    <h4 style="margin:0 0 16px 0; font-size:1rem; font-weight:800; text-shadow:1px 1px 1px #fff;">📝 Exam Eligibility Tracker</h4>

                    <div class="input-group">
                        <label for="leaveExamStartDate">Select Exam Start Date</label>
                        <input type="date" id="leaveExamStartDate">
                    </div>
                    <button id="runLeaveExamsBtn" class="btn calc-btn" style="background: #2d3748;">Evaluate Post-Leave Eligibility</button>
                    
                    <div id="leaveExamResultBox" style="display:none; margin-top:20px;">
                        <div id="leaveExamGrid" class="dashboard-grid single-card-grid"></div>
                        <div id="leaveExamStatusBox" class="highlight-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="examsPanel" class="panel-section">
        <h3 class="panel-title">📝 Exam Streak Target</h3>

        <div class="input-group">
            <label for="examStartDate">Select Exam Start Date</label>
            <input type="date" id="examStartDate">
        </div>

        <button id="runExamsBtn" class="btn calc-btn">Check Eligibility Status</button>

        <div id="examReportBox" class="report-box">
            <div id="examGrid" class="dashboard-grid single-card-grid"></div>
            <div id="examStatusBox" class="highlight-box"></div>
        </div>
    </div>

    <div class="credits-footer">
        Developed by: <strong>Dixansh Yadav</strong>
        <span class="branch-text">Branch: Civil Engineering</span>
    </div>
</div>

<script>
    let TARGET_PCT = 75.0;
    let includeSaturdays = false;

    let postLeaveTotalClasses = 0;
    let postLeaveAttendedClasses = 0;
    let postLeaveTimelineEnd = null; 

    function getSystemTomorrowDateString() {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        return `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
    }

    const tomorrowStr = getSystemTomorrowDateString();
    document.getElementById('examStartDate').value = tomorrowStr;
    document.getElementById('examStartDate').min = tomorrowStr;
    document.getElementById('leaveExamStartDate').value = tomorrowStr;
    document.getElementById('leaveExamStartDate').min = tomorrowStr;

    document.getElementById('settingsToggle').addEventListener('click', function() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    });

    document.getElementById('satNoBtn').addEventListener('click', function() {
        this.classList.add('toggle-active');
        document.getElementById('satYesBtn').classList.remove('toggle-active');
        includeSaturdays = false;
    });
    document.getElementById('satYesBtn').addEventListener('click', function() {
        this.classList.add('toggle-active');
        document.getElementById('satNoBtn').classList.remove('toggle-active');
        includeSaturdays = true;
    });

    document.getElementById('configCriteria').addEventListener('input', function() {
        let val = parseFloat(this.value);
        if (!isNaN(val) && val > 0 && val <= 100) TARGET_PCT = val; else TARGET_PCT = 75.0;
    });

    function getClassesPerDay() {
        const val = parseInt(document.getElementById('globalClassesPerDay').value, 10);
        return (!isNaN(val) && val > 0) ? val : 6;
    }

    function countWorkingDays(dateStart, dateEnd) {
        if (dateEnd < dateStart) return 0;
        let count = 0;
        let current = new Date(dateStart.getTime());
        while (current <= dateEnd) {
            let day = current.getDay();
            if (includeSaturdays) {
                if (day !== 0) count++;
            } else {
                if (day !== 0 && day !== 6) count++;
            }
            current.setDate(current.getDate() + 1);
        }
        return count;
    }

    function formatDaysAndClasses(totalClasses, classesPerDay) {
        if (totalClasses <= 0) return "0 Days";
        const days = Math.floor(totalClasses / classesPerDay);
        const remainingClasses = totalClasses % classesPerDay;
        
        if (days > 0 && remainingClasses > 0) return `${days} Day${days > 1 ? 's' : ''}, ${remainingClasses} Class${remainingClasses > 1 ? 'es' : ''}`;
        else if (days > 0) return `${days} Day${days > 1 ? 's' : ''}`;
        else return `${remainingClasses} Class${remainingClasses > 1 ? 'es' : ''}`;
    }

    function addLeaveRow() {
        const container = document.getElementById('leaveRowsContainer');
        const minSelectableTomorrow = getSystemTomorrowDateString();
        const row = document.createElement('div');
        row.className = 'leave-row';
        
        row.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label style="font-size:0.7rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:6px;">From</label>
                    <input type="date" class="row-start-date" value="${minSelectableTomorrow}" min="${minSelectableTomorrow}">
                </div>
                <div>
                    <label style="font-size:0.7rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:6px;">To</label>
                    <input type="date" class="row-end-date" value="${minSelectableTomorrow}" min="${minSelectableTomorrow}">
                </div>
            </div>
            <button type="button" class="remove-row-btn" onclick="this.parentElement.remove()">Remove Period ✕</button>
        `;
        
        const fromInput = row.querySelector('.row-start-date');
        const toInput = row.querySelector('.row-end-date');

        fromInput.addEventListener('change', function() {
            toInput.min = fromInput.value;
            if (toInput.value < fromInput.value) toInput.value = fromInput.value;
        });

        container.appendChild(row);
    }

    addLeaveRow();
    document.getElementById('addLeaveRowBtn').addEventListener('click', addLeaveRow);

    document.getElementById('toggleLeaveExamBtn').addEventListener('click', function() {
        const drawer = document.getElementById('leaveExamDrawer');
        if (drawer.style.display === "none") {
            drawer.style.display = "block";
            this.classList.add('btn-active');
        } else {
            drawer.style.display = "none";
            this.classList.remove('btn-active');
        }
    });

    function parseManualDaysInput() {
        const val = document.getElementById('manualLeaveDays').value.trim();
        const num = parseFloat(val);
        if (!isNaN(num)) return num;
        const dayMatch = val.match(/^(\d+(\.\d+)?)\s*day/i);
        if (dayMatch) return parseFloat(dayMatch[1]);
        return 0;
    }

    function updateFieldsFromManualClasses() {
        const classes = parseInt(document.getElementById('manualLeaveClasses').value, 10) || 0;
        document.getElementById('manualLeaveDays').value = formatDaysAndClasses(classes, getClassesPerDay());
    }

    function updateFieldsFromManualDays() {
        const days = parseManualDaysInput();
        const classesPerDay = getClassesPerDay();
        const totalClasses = Math.round(days * classesPerDay);
        document.getElementById('manualLeaveClasses').value = totalClasses;
        document.getElementById('manualLeaveDays').value = formatDaysAndClasses(totalClasses, classesPerDay);
    }

    document.getElementById('manualLeaveDays').addEventListener('focus', function() {
        const val = this.value.trim().toLowerCase();
        if (val === '0' || val === '0 days' || val === '') this.value = '';
    });
    document.getElementById('manualLeaveClasses').addEventListener('focus', function() {
        const val = this.value.trim();
        if (val === '0' || val === '') this.value = '';
    });

    document.getElementById('manualLeaveDays').addEventListener('blur', updateFieldsFromManualDays);
    document.getElementById('manualLeaveDays').addEventListener('keypress', function(e) { if(e.key === 'Enter') updateFieldsFromManualDays(); });
    document.getElementById('manualLeaveClasses').addEventListener('input', updateFieldsFromManualClasses);
    document.getElementById('globalClassesPerDay').addEventListener('input', function() {
        if (document.getElementById('leaveMethod').value === 'manual') updateFieldsFromManualClasses();
    });

    document.getElementById('leaveMethod').addEventListener('change', function() {
        const isManual = this.value === 'manual';
        document.getElementById('manualInputGroup').style.display = isManual ? 'grid' : 'none';
        document.getElementById('calendarInputGroup').style.display = isManual ? 'none' : 'block';
        if (isManual) updateFieldsFromManualClasses();
    });

    document.getElementById('calcBtn').addEventListener('click', function() {
        const total = parseInt(document.getElementById('totalClasses').value.trim(), 10);
        const attended = parseInt(document.getElementById('attendedClasses').value.trim(), 10);
        
        document.getElementById('errorBox').style.display = "none";
        document.getElementById('resultBox').style.display = "none";
        document.getElementById('recoveryPanel').style.display = "none";
        document.getElementById('leavesPanel').style.display = "none";
        document.getElementById('examsPanel').style.display = "none";

        document.getElementById('optRecoveryBtn').classList.remove('btn-active');
        document.getElementById('optLeavesBtn').classList.remove('btn-active');
        document.getElementById('optExamsBtn').classList.remove('btn-active');

        if (isNaN(total) || isNaN(attended) || total <= 0 || attended < 0 || attended > total) {
            document.getElementById('errorBox').innerText = "❌ Please enter valid numbers. Attended classes cannot exceed total classes.";
            document.getElementById('errorBox').style.display = "block";
            return;
        }

        const currentPct = (attended / total) * 100;
        const displayEl = document.getElementById('displayPct');
        displayEl.innerText = currentPct.toFixed(2) + "%";

        const statusBadge = document.getElementById('displayStatus');
        const optionsContainer = document.getElementById('optionsContainer');
        const recoveryButton = document.getElementById('optRecoveryBtn');
        const examButton = document.getElementById('optExamsBtn');

        if (currentPct >= TARGET_PCT) {
            statusBadge.innerText = `Safe (≥ ${TARGET_PCT}%)`;
            statusBadge.className = "status-message status-pass";
            displayEl.className = "percentage pct-pass";
            
            recoveryButton.style.display = "none";
            examButton.style.display = "none";
            optionsContainer.className = "choice-container layout-grid-safe";
        } else {
            statusBadge.innerText = `Low (< ${TARGET_PCT}%)`;
            statusBadge.className = "status-message status-fail";
            displayEl.className = "percentage pct-fail";
            
            recoveryButton.style.display = "block";
            examButton.style.display = "block";
            optionsContainer.className = "choice-container layout-grid-low";
        }

        document.getElementById('resultBox').style.display = "block";
    });

    document.getElementById('optRecoveryBtn').addEventListener('click', function() {
        this.classList.add('btn-active');
        document.getElementById('optLeavesBtn').classList.remove('btn-active');
        document.getElementById('optExamsBtn').classList.remove('btn-active');
        document.getElementById('recoveryPanel').style.display = "block";
        document.getElementById('leavesPanel').style.display = "none";
        document.getElementById('examsPanel').style.display = "none";
        calculateAttendanceRecoveryTimeline();
    });

    function calculateAttendanceRecoveryTimeline() {
        const total = parseInt(document.getElementById('totalClasses').value, 10);
        const attended = parseInt(document.getElementById('attendedClasses').value, 10);
        const classesPerDay = getClassesPerDay();
        
        const grid = document.getElementById('recoveryGrid');
        const report = document.getElementById('recoverySafeReport');
        grid.style.display = "none"; report.style.display = "none";

        if ((attended / total) * 100 >= TARGET_PCT) {
            report.innerHTML = `✅ <strong>Safe Status:</strong> Your attendance is already above ${TARGET_PCT}%.`;
            report.style.display = "block";
        } else {
            let reqClasses = Math.ceil(((TARGET_PCT/100) * total - attended) / (1 - (TARGET_PCT/100)));
            let outputDaysStr = formatDaysAndClasses(reqClasses, classesPerDay);
            grid.innerHTML = `
                <div class="dashboard-card"><div class="dashboard-val" style="color:var(--success);">${reqClasses}</div><div class="dashboard-lbl">Classes Needed</div></div>
                <div class="dashboard-card"><div class="dashboard-val" style="color:var(--success); font-size:1.4rem; padding: 4px 0;">${outputDaysStr}</div><div class="dashboard-lbl">Working Days</div></div>`;
            grid.style.display = "grid";
        }
    }

    document.getElementById('optLeavesBtn').addEventListener('click', function() {
        this.classList.add('btn-active');
        document.getElementById('optRecoveryBtn').classList.remove('btn-active');
        document.getElementById('optExamsBtn').classList.remove('btn-active');
        document.getElementById('leavesPanel').style.display = "block";
        document.getElementById('recoveryPanel').style.display = "none";
        document.getElementById('examsPanel').style.display = "none";
    });

    document.getElementById('optExamsBtn').addEventListener('click', function() {
        this.classList.add('btn-active');
        document.getElementById('optRecoveryBtn').classList.remove('btn-active');
        document.getElementById('optLeavesBtn').classList.remove('btn-active');
        document.getElementById('examsPanel').style.display = "block";
        document.getElementById('recoveryPanel').style.display = "none";
        document.getElementById('leavesPanel').style.display = "none";
    });

    document.getElementById('runLeavesBtn').addEventListener('click', function() {
        const total = parseInt(document.getElementById('totalClasses').value, 10);
        const attended = parseInt(document.getElementById('attendedClasses').value, 10);
        const classesPerDay = getClassesPerDay();
        const method = document.getElementById('leaveMethod').value;
        
        let adjustedTotal = total, adjustedAttended = attended, totalLeaveClassesCalculated = 0;
        let tomorrowObj = new Date();
        tomorrowObj.setDate(tomorrowObj.getDate() + 1);
        let calculationStartPoint = new Date(tomorrowObj.getFullYear(), tomorrowObj.getMonth(), tomorrowObj.getDate());

        if (method === 'manual') {
            totalLeaveClassesCalculated = parseInt(document.getElementById('manualLeaveClasses').value, 10) || 0;
            adjustedTotal += totalLeaveClassesCalculated;
            
            postLeaveTotalClasses = adjustedTotal;
            postLeaveAttendedClasses = adjustedAttended;
            
            let manualDaysCount = Math.ceil(parseManualDaysInput());
            let endObj = new Date(calculationStartPoint.getTime());
            let workingDaysFound = 0;
            
            if (manualDaysCount > 0) {
                while (workingDaysFound < manualDaysCount) {
                    let day = endObj.getDay();
                    let isWorking = includeSaturdays ? (day !== 0) : (day !== 0 && day !== 6);
                    if (isWorking) workingDaysFound++;
                    if (workingDaysFound < manualDaysCount) endObj.setDate(endObj.getDate() + 1);
                }
            } else {
                endObj.setDate(endObj.getDate() - 1); 
            }
            postLeaveTimelineEnd = endObj;
        } else {
            const startInputs = document.querySelectorAll('.row-start-date');
            const endInputs = document.querySelectorAll('.row-end-date');
            let furthestLeaveEnd = new Date(calculationStartPoint.getTime());
            let leaveDaysSet = new Set();

            for (let i = 0; i < startInputs.length; i++) {
                let pStart = startInputs[i].value.split('-');
                let pEnd = endInputs[i].value.split('-');
                let sD = new Date(pStart[0], pStart[1] - 1, pStart[2]);
                let eD = new Date(pEnd[0], pEnd[1] - 1, pEnd[2]);
                if (eD > furthestLeaveEnd) furthestLeaveEnd = new Date(eD.getTime());
                let loop = new Date(sD.getTime());
                while (loop <= eD) {
                    let day = loop.getDay();
                    let isWorking = includeSaturdays ? (day !== 0) : (day !== 0 && day !== 6);
                    if (loop >= calculationStartPoint && isWorking) leaveDaysSet.add(loop.toDateString());
                    loop.setDate(loop.getDate() + 1);
                }
            }
            let totalDaysNum = leaveDaysSet.size;
            totalLeaveClassesCalculated = totalDaysNum * classesPerDay;
            let totalTimelineWorkingDays = countWorkingDays(calculationStartPoint, furthestLeaveEnd);
            adjustedTotal += (totalTimelineWorkingDays * classesPerDay);
            adjustedAttended += ((totalTimelineWorkingDays - totalDaysNum) * classesPerDay);

            postLeaveTotalClasses = adjustedTotal;
            postLeaveAttendedClasses = adjustedAttended;
            postLeaveTimelineEnd = furthestLeaveEnd;
        }

        const projectedAttendance = (adjustedAttended / adjustedTotal) * 100;
        const color = projectedAttendance >= TARGET_PCT ? 'var(--success)' : 'var(--danger)';
        
        document.getElementById('leaveGrid').innerHTML = `
            <div class="dashboard-card" style="grid-column: span 2;"><div class="dashboard-val" style="color: ${color};">${projectedAttendance.toFixed(2)}%</div><div class="dashboard-lbl">Projected Attendance after leaves</div></div>
            <div class="dashboard-card"><div class="dashboard-val">${adjustedTotal}</div><div class="dashboard-lbl">Total Post-Leave Classes</div></div>
            <div class="dashboard-card"><div class="dashboard-val">${adjustedAttended}</div><div class="dashboard-lbl">Attended Post-Leave Classes</div></div>`;

        const recGrid = document.getElementById('leaveRecoveryGrid');
        const statusBox = document.getElementById('leaveStatusBox');
        const leaveExamSec = document.getElementById('leaveExamSection');
        
        document.getElementById('leaveExamDrawer').style.display = "none";
        document.getElementById('toggleLeaveExamBtn').classList.remove('btn-active');
        document.getElementById('leaveExamResultBox').style.display = "none";

        let minCalendarBound = new Date(postLeaveTimelineEnd.getTime());
        minCalendarBound.setDate(minCalendarBound.getDate() + 1);
        let minCalStr = `${minCalendarBound.getFullYear()}-${String(minCalendarBound.getMonth() + 1).padStart(2, '0')}-${String(minCalendarBound.getDate()).padStart(2, '0')}`;
        document.getElementById('leaveExamStartDate').min = minCalStr;
        if(document.getElementById('leaveExamStartDate').value < minCalStr) document.getElementById('leaveExamStartDate').value = minCalStr;

        if (projectedAttendance < TARGET_PCT) {
            let reqClasses = Math.ceil(((TARGET_PCT/100) * adjustedTotal - adjustedAttended) / (1 - (TARGET_PCT/100)));
            let recoveryDaysDisplayStr = formatDaysAndClasses(reqClasses, classesPerDay);
            
            recGrid.innerHTML = `
                <div class="recovery-info-text">💡 Requirements to reach ${TARGET_PCT}% attendance:</div>
                <div class="dashboard-card"><div class="dashboard-val" style="color:var(--success);">${reqClasses}</div><div class="dashboard-lbl">Recovery Classes</div></div>
                <div class="dashboard-card"><div class="dashboard-val" style="color:var(--success); font-size:1.4rem; padding: 4px 0;">${recoveryDaysDisplayStr}</div><div class="dashboard-lbl">Recovery Days</div></div>`;
            recGrid.style.display = "grid";
            statusBox.style.display = "none";
            leaveExamSec.style.display = "block";
        } else {
            recGrid.style.display = "none";
            statusBox.style.borderLeftColor = 'var(--success)';
            statusBox.innerHTML = `✅ <strong>Status Safe:</strong> Your attendance will stay safely above the ${TARGET_PCT}% requirement.`;
            statusBox.style.display = "block";
            leaveExamSec.style.display = "none";
        }
        document.getElementById('leaveReportBox').style.display = "block";
    });

    document.getElementById('runLeaveExamsBtn').addEventListener('click', function() {
        const classesPerDay = getClassesPerDay();
        const examDateVal = document.getElementById('leaveExamStartDate').value;
        if (!examDateVal) { alert("Please choose a valid date from the calendar."); return; }

        let startWindow = new Date(postLeaveTimelineEnd.getTime());
        startWindow.setDate(startWindow.getDate() + 1);

        let examParts = examDateVal.split('-');
        let examObj = new Date(examParts[0], examParts[1] - 1, examParts[2]);
        let dayBeforeExam = new Date(examObj.getTime());
        dayBeforeExam.setDate(dayBeforeExam.getDate() - 1);

        let streakWorkingDays = countWorkingDays(startWindow, dayBeforeExam);
        let potentialClasses = streakWorkingDays * classesPerDay;

        let finalTotal = postLeaveTotalClasses + potentialClasses;
        let finalAttended = postLeaveAttendedClasses + potentialClasses;
        let targetStreakPct = (finalAttended / finalTotal) * 100;

        const lExamGrid = document.getElementById('leaveExamGrid');
        const lExamStatusBox = document.getElementById('leaveExamStatusBox');

        if (targetStreakPct >= TARGET_PCT) {
            lExamGrid.innerHTML = `
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--success);">${targetStreakPct.toFixed(2)}%</div><div class="dashboard-lbl">Projected Target Streak</div></div>
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--success); font-size:1.3rem; padding-top:4px;">ELIGIBLE</div><div class="dashboard-lbl">Exam Eligibility</div></div>`;
            lExamStatusBox.style.borderLeftColor = 'var(--success)';
            lExamStatusBox.innerHTML = `✅ Perfect attendance until exams will rescue your record, making you <strong>Eligible for Exams</strong>.`;
        } else {
            lExamGrid.innerHTML = `
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--danger);">${targetStreakPct.toFixed(2)}%</div><div class="dashboard-lbl">Projected Target Streak</div></div>
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--danger); font-size:1.3rem; padding-top:4px;">NOT ELIGIBLE</div><div class="dashboard-lbl">Exam Eligibility</div></div>`;
            lExamStatusBox.style.borderLeftColor = 'var(--danger)';
            lExamStatusBox.innerHTML = `❌ Even with an unbroken streak, you will remain <strong>Not Eligible</strong>.`;
        }
        document.getElementById('leaveExamResultBox').style.display = "block";
    });

    document.getElementById('runExamsBtn').addEventListener('click', function() {
        const total = parseInt(document.getElementById('totalClasses').value, 10);
        const attended = parseInt(document.getElementById('attendedClasses').value, 10);
        const classesPerDay = getClassesPerDay();
        const examDateVal = document.getElementById('examStartDate').value;
        if (!examDateVal) { alert("Please choose a valid date from the calendar."); return; }

        let tomorrowObj = new Date();
        tomorrowObj.setDate(tomorrowObj.getDate() + 1);
        let startWindow = new Date(tomorrowObj.getFullYear(), tomorrowObj.getMonth(), tomorrowObj.getDate());

        let examParts = examDateVal.split('-');
        let examObj = new Date(examParts[0], examParts[1] - 1, examParts[2]);
        let dayBeforeExam = new Date(examObj.getTime());
        dayBeforeExam.setDate(dayBeforeExam.getDate() - 1);

        let streakWorkingDays = countWorkingDays(startWindow, dayBeforeExam);
        let potentialClasses = streakWorkingDays * classesPerDay;

        let finalTotal = total + potentialClasses;
        let finalAttended = attended + potentialClasses;
        let targetStreakPct = (finalAttended / finalTotal) * 100;

        const examGrid = document.getElementById('examGrid');
        const examStatusBox = document.getElementById('examStatusBox');

        if (targetStreakPct >= TARGET_PCT) {
            examGrid.innerHTML = `
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--success);">${targetStreakPct.toFixed(2)}%</div><div class="dashboard-lbl">Projected Target Streak</div></div>
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--success); font-size:1.3rem; padding-top:4px;">ELIGIBLE</div><div class="dashboard-lbl">Exam Eligibility</div></div>`;
            examStatusBox.style.borderLeftColor = 'var(--success)';
            examStatusBox.innerHTML = `✅ Going to college daily up until your exams makes you <strong>Eligible for Exams</strong>.`;
        } else {
            examGrid.innerHTML = `
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--danger);">${targetStreakPct.toFixed(2)}%</div><div class="dashboard-lbl">Projected Target Streak</div></div>
                <div class="dashboard-card"><div class="dashboard-val" style="color: var(--danger); font-size:1.3rem; padding-top:4px;">NOT ELIGIBLE</div><div class="dashboard-lbl">Exam Eligibility</div></div>`;
            examStatusBox.style.borderLeftColor = 'var(--danger)';
            examStatusBox.innerHTML = `❌ Even with a flawless streak up until your exams, you remain <strong>Not Eligible</strong>.`;
        }
        document.getElementById('examReportBox').style.display = "block";
    });
</script>
</body>
</html>
