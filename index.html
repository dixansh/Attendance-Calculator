<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="ZbF-XY8vO_fcRmppe3CDMaX6AqzeRB-GZLJ0dsvp7v8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Advanced Attendance Calculator & Planner | 75% Criteria Track</title>
    <meta name="description" content="Free premium attendance calculator and planner for college students. Track target criteria like 75%, plan future leaves, and check recovery timelines automatically.">
    <meta name="keywords" content="attendance calculator, attendance planner, 75 attendance calculator, college attendance tracker, leave planner">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --focus-ring: rgba(79, 70, 229, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(at top right, #e0e7ff 0%, var(--bg) 100%);
            color: var(--text);
            margin: 0;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 98vh;
        }

        .calculator-card {
            background: var(--card);
            padding: 24px 16px;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
        }

        h1 {
            color: var(--text);
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 6px;
            letter-spacing: -0.025em;
            text-align: center;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 18px;
            width: 100%;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background-color: #ffffff;
            color: var(--text);
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .calc-btn { background-color: var(--primary); margin-top: 8px; }
        .calc-btn:hover { background-color: var(--primary-hover); }

        .choice-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        @media (min-width: 380px) {
            .choice-container {
                flex-direction: row;
            }
            .choice-container button {
                flex: 1;
            }
        }

        .secondary-btn {
            width: 100%;
            background-color: #f8fafc;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 12px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
            text-align: center;
        }
        .secondary-btn:hover { background-color: #f1f5f9; }
        .btn-active { background-color: #0f172a; color: white; border-color: #0f172a; }

        .toggle-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
            width: 100%;
        }

        .toggle-btn {
            padding: 12px 6px;
            font-weight: 600;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: center;
        }
        .toggle-active {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .result-section, .panel-section, .report-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: none;
            width: 100%;
        }

        .result-section { text-align: center; }

        .percentage {
            font-size: 2.75rem;
            font-weight: 900;
            margin: 6px 0;
            letter-spacing: -0.04em;
        }

        .status-message {
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 100px;
            display: inline-block;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pass { background-color: #d1fae5; color: #065f46; }
        .status-fail { background-color: #fee2e2; color: #991b1b; }
        
        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 16px;
            display: none;
            text-align: center;
            padding: 10px;
            background-color: #fef2f2;
            border-radius: 10px;
            border: 1px dashed #fca5a5;
        }

        .highlight-box {
            background-color: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 0 12px 12px 0;
            margin-top: 14px;
            font-weight: 500;
            line-height: 1.4;
            font-size: 0.85rem;
            word-wrap: break-word;
        }

        .leave-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            position: relative;
        }

        .leave-row > div {
            width: 100%;
        }

        .add-row-btn {
            background-color: #f1f5f9;
            color: var(--text-secondary);
            padding: 10px 14px;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 16px;
            display: inline-block;
        }

        .remove-row-btn {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
            margin-top: 4px;
        }

        .panel-title {
            margin-top: 0; 
            margin-bottom: 16px;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .credits-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.5;
            text-align: center;
        }
        .credits-footer strong {
            color: var(--text-secondary);
        }
        .branch-text {
            display: block;
            margin-top: 2px;
            color: #64748b;
            font-style: normal;
        }
    </style>
</head>
<body>

<div id="calcCard" class="calculator-card">
    <h1>📊 Attendance Planner</h1>
    <div class="subtitle">Smart track criteria benchmarks & leaves</div>
    
    <div class="input-group">
        <label for="totalClasses">Total Classes Conducted (As of Today)</label>
        <input type="number" id="totalClasses" placeholder="e.g. 100" inputmode="numeric">
    </div>
    
    <div class="input-group">
        <label for="attendedClasses">Classes Attended (As of Today)</label>
        <input type="number" id="attendedClasses" placeholder="e.g. 75" inputmode="numeric">
    </div>

    <button id="calcBtn" class="btn calc-btn">Calculate Attendance</button>
    <div id="errorBox" class="error-message"></div>

    <div id="resultBox" class="result-section">
        <label style="color:#64748b; font-weight:700; font-size: 0.7rem; letter-spacing: 0.05em;">CURRENT ATTENDANCE</label>
        <div id="displayPct" class="percentage">0.00%</div>
        <div id="displayStatus" class="status-message"></div>
        
        <div class="choice-container">
            <button id="optRecoveryBtn" class="secondary-btn">📈 Option 1:<br>Check Recovery</button>
            <button id="optLeavesBtn" class="secondary-btn">📅 Option 2:<br>Leave Planning</button>
        </div>
    </div>

    <div id="recoveryPanel" class="panel-section" style="display:none;">
        <h3 class="panel-title">📈 Attendance Recovery</h3>
        <div class="input-group">
            <label for="recoveryClassesPerDay">Number of Classes Held Per Day</label>
            <input type="number" id="recoveryClassesPerDay" value="6" min="1" inputmode="numeric">
        </div>
        <button id="runRecoveryBtn" class="btn calc-btn">Calculate Recovery Timeline</button>
        
        <div id="recoveryReport" class="highlight-box" style="display:none;"></div>
    </div>

    <div id="leavesPanel" class="panel-section" style="display:none;">
        <h3 class="panel-title" style="border-bottom: 1px solid var(--border); padding-bottom:10px;">📅 Leave Planning</h3>
        
        <div class="input-group">
            <label for="leaveClassesPerDay">Number of Classes Held Per Day</label>
            <input type="number" id="leaveClassesPerDay" value="6" min="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <label>Select Leave Input Type</label>
            <select id="leaveMethod">
                <option value="calendar">Select Dates from Calendar</option>
                <option value="manual">Enter Total Days Directly</option>
            </select>
        </div>

        <div id="todayStatusGroup" class="input-group">
            <label>Have you included today in Total Classes?</label>
            <div class="toggle-container">
                <button type="button" id="todayYesBtn" class="toggle-btn toggle-active">Yes, included</button>
                <button type="button" id="todayNoBtn" class="toggle-btn">No, not yet</button>
            </div>
        </div>

        <div id="manualInputGroup" class="input-group" style="display:none;">
            <label for="manualLeaveDays">Number of Working Days of Leave</label>
            <input type="number" id="manualLeaveDays" placeholder="e.g. 3" min="0" value="0" inputmode="numeric">
        </div>

        <div id="calendarInputGroup">
            <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); display:block; margin-bottom:8px;">Add Leave Windows:</label>
            <div id="leaveRowsContainer"></div>
            <button type="button" class="add-row-btn" id="addLeaveRowBtn">+ Add Leave Period</button>
        </div>

        <button id="runLeavesBtn" class="btn calc-btn">Calculate Leave Impact</button>
        
        <div id="leaveReportBox" class="report-box" style="display:none;">
            <h4 style="margin-top:0; margin-bottom:10px; color: var(--text); font-weight: 700; font-size:0.95rem;">📊 Projections Report (Goal: 75%)</h4>
            <div id="daysCountSummary" style="font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 0.85rem;"></div>
            <div id="projectedAttendanceStr" class="highlight-box"></div>
            <div id="leaveRecoveryStrategyStr" class="highlight-box" style="border-left-color: var(--warning); margin-top: 12px;"></div>
        </div>
    </div>

    <div class="credits-footer">
        Developed by: <strong>Dixansh Yadav</strong>
        <span class="branch-text">Branch: Civil Engineering</span>
    </div>
</div>

<script>
    const TARGET_PCT = 75.0;
    let countTodayState = 'yes';

    function getSystemTodayDateString() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function countWorkingDays(dateStart, dateEnd) {
        if (dateEnd < dateStart) return 0;
        let count = 0;
        let current = new Date(dateStart.getTime());
        while (current <= dateEnd) {
            let day = current.getDay();
            if (day !== 0 && day !== 6) {
                count++;
            }
            current.setDate(current.getDate() + 1);
        }
        return count;
    }

    function addLeaveRow() {
        const container = document.getElementById('leaveRowsContainer');
        const currentSystemToday = getSystemTodayDateString();

        const row = document.createElement('div');
        row.className = 'leave-row';
        
        row.innerHTML = `
            <div>
                <span style="font-size:0.7rem; font-weight:600; color:#64748b; display:block; margin-bottom:2px;">From</span>
                <input type="date" class="row-start-date" value="${currentSystemToday}" min="${currentSystemToday}">
            </div>
            <div>
                <span style="font-size:0.7rem; font-weight:600; color:#64748b; display:block; margin-bottom:2px;">To</span>
                <input type="date" class="row-end-date" value="${currentSystemToday}" min="${currentSystemToday}">
            </div>
            <button type="button" class="remove-row-btn" onclick="this.parentElement.remove()">Remove Period ✕</button>
        `;
        
        const fromInput = row.querySelector('.row-start-date');
        const toInput = row.querySelector('.row-end-date');

        fromInput.addEventListener('change', function() {
            const chosenFromDate = fromInput.value;
            toInput.min = chosenFromDate;
            if (toInput.value < chosenFromDate) {
                toInput.value = chosenFromDate;
            }
        });

        fromInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                toInput.focus();
            }
        });
        
        toInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('runLeavesBtn').click();
            }
        });

        container.appendChild(row);
    }

    addLeaveRow();

    document.getElementById('addLeaveRowBtn').addEventListener('click', addLeaveRow);

    document.getElementById('todayYesBtn').addEventListener('click', function() {
        this.classList.add('toggle-active');
        document.getElementById('todayNoBtn').classList.remove('toggle-active');
        countTodayState = 'yes';
    });

    document.getElementById('todayNoBtn').addEventListener('click', function() {
        this.classList.add('toggle-active');
        document.getElementById('todayYesBtn').classList.remove('toggle-active');
        countTodayState = 'no';
    });

    document.getElementById('leaveMethod').addEventListener('change', function() {
        const isManual = this.value === 'manual';
        document.getElementById('manualInputGroup').style.display = isManual ? 'flex' : 'none';
        document.getElementById('calendarInputGroup').style.display = isManual ? 'none' : 'block';
        document.getElementById('todayStatusGroup').style.display = isManual ? 'none' : 'flex';
    });

    document.getElementById('calcBtn').addEventListener('click', function() {
        const totalVal = document.getElementById('totalClasses').value.trim();
        const attendedVal = document.getElementById('attendedClasses').value.trim();
        const errorBox = document.getElementById('errorBox');
        const resultBox = document.getElementById('resultBox');
        
        errorBox.style.display = "none";
        resultBox.style.display = "none";
        
        document.getElementById('recoveryPanel').style.display = "none";
        document.getElementById('leavesPanel').style.display = "none";
        document.getElementById('optRecoveryBtn').classList.remove('btn-active');
        document.getElementById('optLeavesBtn').classList.remove('btn-active');

        if (totalVal === "" || attendedVal === "") {
            return showError("❌ Please enter values in both fields.");
        }

        const total = parseInt(totalVal, 10);
        const attended = parseInt(attendedVal, 10);

        if (total <= 0) return showError("❌ Total classes must be greater than 0.");
        if (attended < 0) return showError("❌ Attended classes cannot be negative.");
        if (attended > total) return showError("❌ Attended classes cannot exceed total classes.");

        const currentPct = (attended / total) * 100;
        document.getElementById('displayPct').innerText = currentPct.toFixed(2) + "%";

        const statusBadge = document.getElementById('displayStatus');
        if (currentPct >= TARGET_PCT) {
            statusBadge.innerText = "Safe (≥ 75%)";
            statusBadge.className = "status-message status-pass";
            document.getElementById('displayPct').style.color = "var(--success)";
        } else {
            statusBadge.innerText = "Low (< 75%)";
            statusBadge.className = "status-message status-fail";
            document.getElementById('displayPct').style.color = "var(--danger)";
        }

        resultBox.style.display = "block";
    });

    document.getElementById('optRecoveryBtn').addEventListener('click', function() {
        document.getElementById('optRecoveryBtn').classList.add('btn-active');
        document.getElementById('optLeavesBtn').classList.remove('btn-active');
        document.getElementById('recoveryPanel').style.display = "block";
        document.getElementById('leavesPanel').style.display = "none";
        document.getElementById('recoveryReport').style.display = "none";
    });

    document.getElementById('optLeavesBtn').addEventListener('click', function() {
        document.getElementById('optLeavesBtn').classList.add('btn-active');
        document.getElementById('optRecoveryBtn').classList.remove('btn-active');
        document.getElementById('leavesPanel').style.display = "block";
        document.getElementById('recoveryPanel').style.display = "none";
        document.getElementById('leaveReportBox').style.display = "none";
    });

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = msg;
        errorBox.style.display = "block";
    }

    document.getElementById('runRecoveryBtn').addEventListener('click', function() {
        const total = parseInt(document.getElementById('totalClasses').value, 10);
        const attended = parseInt(document.getElementById('attendedClasses').value, 10);
        const cpdVal = document.getElementById('recoveryClassesPerDay').value.trim();
        const report = document.getElementById('recoveryReport');
        report.style.display = "none";

        if (cpdVal === "" || parseInt(cpdVal, 10) <= 0) return alert("Please enter valid classes per day.");
        const classesPerDay = parseInt(cpdVal, 10);
        const currentPct = (attended / total) * 100;

        if (currentPct >= TARGET_PCT) {
            report.innerHTML = `✅ <strong>Status Safe:</strong> Your current attendance is <strong>${currentPct.toFixed(2)}%</strong>, which is already above the 75% requirement. No recovery layout is needed.`;
        } else {
            const targetFraction = TARGET_PCT / 100;
            let requiredClasses = Math.ceil((targetFraction * total - attended) / (1 - targetFraction));
            let requiredDays = Math.ceil(requiredClasses / classesPerDay);
            let targetGrandTotal = total + requiredClasses;

            report.innerHTML = `🎯 <strong>Recovery Track to 75%:</strong><br>
            • Must attend next: <strong>${requiredClasses} classes</strong> consecutively.<br>
            • Duration needed: ~<strong>${requiredDays} full working days</strong> of perfect attendance.<br>
            • <strong>Target Milestone:</strong> Your attendance will hit 75% when the total classes conducted reaches <strong>${targetGrandTotal}</strong> (and you have attended ${attended + requiredClasses} of them).`;
        }
        report.style.display = "block";
    });

    document.getElementById('runLeavesBtn').addEventListener('click', function() {
        const total = parseInt(document.getElementById('totalClasses').value, 10);
        const attended = parseInt(document.getElementById('attendedClasses').value, 10);
        const cpdVal = document.getElementById('leaveClassesPerDay').value.trim();
        const method = document.getElementById('leaveMethod').value;
        const reportBox = document.getElementById('leaveReportBox');
        reportBox.style.display = "none";

        if (cpdVal === "" || parseInt(cpdVal, 10) <= 0) return alert("Please enter valid classes per day.");
        const classesPerDay = parseInt(cpdVal, 10);

        let adjustedTotal = total;
        let adjustedAttended = attended;
        let workingDaysOfLeave = 0;

        if (method === 'manual') {
            const manualDays = document.getElementById('manualLeaveDays').value.trim();
            if (manualDays === "" || parseInt(manualDays, 10) < 0) return alert("Please enter valid leave days.");
            workingDaysOfLeave = parseInt(manualDays, 10);
            adjustedTotal += (workingDaysOfLeave * classesPerDay);
        } else {
            const startInputs = document.querySelectorAll('.row-start-date');
            const endInputs = document.querySelectorAll('.row-end-date');
            
            if (startInputs.length === 0) return alert("Please add at least one leave date range row.");

            let todayParts = getSystemTodayDateString().split('-');
            let todayObj = new Date(todayParts[0], todayParts[1] - 1, todayParts[2], 0, 0, 0, 0);

            let calculationStartPoint = new Date(todayObj.getTime());
            
            if (countTodayState === 'yes') {
                calculationStartPoint.setDate(calculationStartPoint.getDate() + 1);
            }

            let furthestLeaveEnd = new Date(calculationStartPoint.getTime());
            let leaveDaysSet = new Set();

            for (let i = 0; i < startInputs.length; i++) {
                if (!startInputs[i].value || !endInputs[i].value) {
                    return alert(`Please completely fill out all dates in period #${i + 1}`);
                }
                
                let pStart = startInputs[i].value.split('-');
                let pEnd = endInputs[i].value.split('-');
                
                let sD = new Date(pStart[0], pStart[1] - 1, pStart[2], 0, 0, 0, 0);
                let eD = new Date(pEnd[0], pEnd[1] - 1, pEnd[2], 0, 0, 0, 0);

                if (sD < todayObj || eD < todayObj) {
                    return alert(`❌ Error in Period #${i + 1}: Past dates cannot be computed.`);
                }
                if (eD < sD) {
                    return alert(`❌ Error in Period #${i + 1}: End date cannot be before start date.`);
                }

                if (eD > furthestLeaveEnd) {
                    furthestLeaveEnd = new Date(eD.getTime());
                }

                let loop = new Date(sD.getTime());
                while (loop <= eD) {
                    if (loop >= calculationStartPoint && loop.getDay() !== 0 && loop.getDay() !== 6) {
                        leaveDaysSet.add(loop.toDateString());
                    }
                    loop.setDate(loop.getDate() + 1);
                }
            }

            workingDaysOfLeave = leaveDaysSet.size;

            let totalTimelineWorkingDays = countWorkingDays(calculationStartPoint, furthestLeaveEnd);
            let perfectAttendanceWorkingDays = totalTimelineWorkingDays - workingDaysOfLeave;

            adjustedTotal += (totalTimelineWorkingDays * classesPerDay);
            adjustedAttended += (perfectAttendanceWorkingDays * classesPerDay);
        }

        const projectedAttendance = (adjustedAttended / adjustedTotal) * 100;

        document.getElementById('daysCountSummary').innerText = `📝 Total Leave Tracked (Working Days): ${workingDaysOfLeave} Day(s)`;
        
        const colorStr = projectedAttendance >= TARGET_PCT ? 'var(--success)' : 'var(--danger)';
        document.getElementById('projectedAttendanceStr').innerHTML = `📉 Projected Attendance: <strong style='color: ${colorStr}'>${projectedAttendance.toFixed(2)}%</strong> (Classes: ${adjustedAttended} / ${adjustedTotal})`;

        const recStr = document.getElementById('leaveRecoveryStrategyStr');
        if (projectedAttendance < TARGET_PCT) {
            const targetFraction = TARGET_PCT / 100;
            let requiredClasses = Math.ceil((targetFraction * adjustedTotal - adjustedAttended) / (1 - targetFraction));
            let requiredDays = Math.ceil(requiredClasses / classesPerDay);
            let postLeaveGrandTotal = adjustedTotal + requiredClasses;

            recStr.innerHTML = `⚠️ <strong>Post-Leave Recovery Strategy:</strong><br>
            To recover back to 75% after your planned leaves, you will need to attend the next <strong>${requiredClasses} classes</strong> consecutively (~<strong>${requiredDays} working days</strong>). Your attendance will reset to 75% when the overall classes count reaches a grand total of <strong>${postLeaveGrandTotal}</strong>.`;
        } else {
            recStr.innerHTML = `✅ <strong>Status Safe:</strong> Even after taking these leaves, your attendance will remain above the 75% target benchmark.`;
        }

        reportBox.style.display = "block";
    });

    /* --- ENTER KEY JUMP LOGIC --- */
    document.getElementById('totalClasses').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('attendedClasses').focus();
        }
    });

    document.getElementById('attendedClasses').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('calcBtn').click();
        }
    });

    document.getElementById('recoveryClassesPerDay').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('runRecoveryBtn').click();
        }
    });

    document.getElementById('leaveClassesPerDay').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const leaveMethod = document.getElementById('leaveMethod').value;
            if (leaveMethod === 'manual') {
                document.getElementById('manualLeaveDays').focus();
            } else {
                const queryFirstStartRow = document.querySelector('.row-start-date');
                if (queryFirstStartRow) queryFirstStartRow.focus();
            }
        }
    });

    document.getElementById('manualLeaveDays').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('runLeavesBtn').click();
        }
    });
</script>
</body>
</html>
